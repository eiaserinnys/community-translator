server {
    listen 80;
    listen [::]:80;
    server_name translator.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name translator.example.com;

    ssl_certificate /etc/letsencrypt/live/translator.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/translator.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:3119;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        # A codex run at xhigh effort can take minutes, so the read timeout has to
        # outlast TRANSLATOR_CODEX_TIMEOUT_MS rather than cut the request short.
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }
}
