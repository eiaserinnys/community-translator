packages:
  - apps/server
  - apps/extension
  - packages/contracts
  - packages/eslint-config
  - packages/typescript-config

# Dependencies allowed to run install scripts. Anything not listed is refused, and
# `pnpm install --frozen-lockfile` fails rather than quietly skipping it.
allowBuilds:
  esbuild: true
  spawn-sync: true

catalog:
  '@eslint/js': 10.0.1
  '@types/node': 24.13.3
  eslint: 10.7.0
  fake-indexeddb: 6.2.5
  fastify: 5.10.0
  globals: 17.7.0
  jsdom: 30.1.0
  openapi-fetch: 0.17.0
  openapi-typescript: 7.13.0
  tsx: 4.23.1
  typescript: 5.9.3
  typescript-eslint: 8.64.0
  vitest: 4.1.10
  wxt: 0.20.27
  yaml: 2.9.1
  zod: 4.4.3
